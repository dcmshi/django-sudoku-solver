services:
  - type: web
    name: django-sudoku-solver
    env: python
    buildCommand: "pip install uv && uv sync && uv run python manage.py collectstatic --noinput"
    startCommand: "uv run gunicorn sudoku_solver.wsgi --log-file -"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.15
